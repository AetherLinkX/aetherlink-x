name: Feature request
description: Suggest a focused improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Android client
        - ALX transport
        - Server operations
        - Documentation
    validations:
      required: true
  - type: textarea
    id: need
    attributes:
      label: Problem or use case
      description: What should become easier, safer or more reliable?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior rather than only the visual result.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
