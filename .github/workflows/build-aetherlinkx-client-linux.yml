name: Build AetherLink X Client (Linux)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "client/linux/**"
      - "dist/linux-amd64/xray-aetherlinkx"
      - ".github/workflows/build-aetherlinkx-client-linux.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Stage ALX core and runtime data
        shell: bash
        run: |
          set -euo pipefail
          R=client/linux/resources/linux-x64
          mkdir -p "$R"
          install -m 0755 dist/linux-amd64/xray-aetherlinkx "$R/xray"
          "$R/xray" version | grep -F "26.7.28"
          curl -fL --retry 3 -o "$RUNNER_TEMP/tun2socks.zip" \
            https://github.com/xjasonlyu/tun2socks/releases/latest/download/tun2socks-linux-amd64.zip
          unzip -o "$RUNNER_TEMP/tun2socks.zip" -d "$RUNNER_TEMP/tun2socks"
          install -m 0755 "$(find "$RUNNER_TEMP/tun2socks" -type f -name 'tun2socks*' | head -1)" "$R/tun2socks"
          curl -fL --retry 3 -o "$R/geoip.dat" \
            https://github.com/v2fly/geoip/releases/latest/download/geoip.dat
          curl -fL --retry 3 -o "$R/geosite.dat" \
            https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat

      - name: Generate Gradle wrapper
        working-directory: client/linux
        run: gradle wrapper --gradle-version=9.4.1

      - name: Test and package
        working-directory: client/linux
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew test createReleaseDistributable --no-daemon --stacktrace

      - name: Archive application
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find client/linux/build/compose/binaries -type d -name AetherLinkXClient | head -1)
          test -n "$APP"
          tar -C "$(dirname "$APP")" -czf aetherlink-x-client-linux-x64.tar.gz "$(basename "$APP")"

      - uses: actions/upload-artifact@v4
        with:
          name: aetherlink-x-client-linux-x64
          retention-days: 30
          path: |
            aetherlink-x-client-linux-x64.tar.gz
            client/linux/build/reports/tests/test/
