name: Build AetherLink Native Server

on:
  workflow_dispatch:
  push:
    branches: [main, "alx/**"]
    paths:
      - "core/alx/**"
      - ".github/workflows/build-aetherlinkx-native-server.yml"

permissions:
  contents: write

jobs:
  linux-amd64:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"
          cache-dependency-path: core/alx/go.sum
      - name: Test protocol
        working-directory: core/alx
        run: go test -race ./...
      - name: Build server
        working-directory: core/alx
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          go build -trimpath -ldflags='-s -w -buildid=' \
            -o ../../aetherlink-native-server-linux-amd64 ./cmd/alx-server
          sha256sum ../../aetherlink-native-server-linux-amd64 \
            > ../../aetherlink-native-server-linux-amd64.sha256
      - uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: aetherlink-native-server-linux-amd64
          retention-days: 30
          path: |
            aetherlink-native-server-linux-amd64
            aetherlink-native-server-linux-amd64.sha256
      - name: Publish native server preview
        if: github.ref == 'refs/heads/alx/native-preview'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SERVER_PREVIEW_TAG: server-v0.1.0-alx-native-preview.2
        run: |
          set -euo pipefail
          git tag --force "$SERVER_PREVIEW_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$SERVER_PREVIEW_TAG" --force
          if ! gh release view "$SERVER_PREVIEW_TAG" >/dev/null 2>&1; then
            gh release create "$SERVER_PREVIEW_TAG" --prerelease --verify-tag \
              --title "AetherLink Native Server 0.1.0 — preview 2" \
              --notes "Independent ALX/1 server preview with adaptive high-bandwidth QUIC receive windows, QUIC/UDP, pinned TLS/TCP fallback, replay-resistant authentication, UDP relay, and ALPN-based coexistence with an existing Xray listener."
          fi
          gh release upload "$SERVER_PREVIEW_TAG" \
            aetherlink-native-server-linux-amd64 \
            aetherlink-native-server-linux-amd64.sha256 --clobber
