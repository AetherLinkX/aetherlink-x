name: Build AetherLink Native Server

on:
  workflow_dispatch:
  push:
    branches: [main, "alx/**"]
    paths:
      - "core/alx/**"
      - ".github/workflows/build-aetherlinkx-native-server.yml"

permissions:
  contents: write

env:
  SERVER_PREVIEW_TAG: server-v0.2.2-alx-preview.8-rw.2

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"
          cache-dependency-path: core/alx/go.sum
      - name: Test protocol
        working-directory: core/alx
        run: |
          go mod download
          go mod verify
          go test -race ./...
      - name: Test Remnawave installer
        run: |
          bash -n core/alx/deploy/remnawave/install.sh
          bash -n core/alx/deploy/remnawave/install-panel.sh
          bash -n core/alx/deploy/remnawave/test-install.sh
          bash core/alx/deploy/remnawave/test-install.sh

  prepare-release:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Prepare native server preview release
        if: github.ref == 'refs/heads/alx/native-preview'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git tag --force "$SERVER_PREVIEW_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$SERVER_PREVIEW_TAG" --force
          if ! gh release view "$SERVER_PREVIEW_TAG" >/dev/null 2>&1; then
            gh release create "$SERVER_PREVIEW_TAG" --prerelease --verify-tag \
              --title "AetherLink Native Server 0.2.2 — Native Remnawave Control" \
              --notes "Native ALX/1 Turbo server with atomic Remnawave runtime configuration, token rotation, session-bound authentication, authenticated HTTP Upgrade cover transport, automatic TCP/QUIC paths, and amd64/arm64 support."
          else
            gh release edit "$SERVER_PREVIEW_TAG" --prerelease \
              --title "AetherLink Native Server 0.2.2 — Native Remnawave Control" \
              --notes "Native ALX/1 Turbo server with atomic Remnawave runtime configuration, token rotation, session-bound authentication, authenticated HTTP Upgrade cover transport, automatic TCP/QUIC paths, and amd64/arm64 support."
          fi

  build:
    needs: [test, prepare-release]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"
          cache-dependency-path: core/alx/go.sum
      - name: Build server
        working-directory: core/alx
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: |
          go build -trimpath -ldflags='-s -w -buildid=' \
            -o ../../aetherlink-native-server-linux-${GOARCH} ./cmd/alx-server
          sha256sum ../../aetherlink-native-server-linux-${GOARCH} \
            > ../../aetherlink-native-server-linux-${GOARCH}.sha256
      - name: Upload server binary to preview release
        if: github.ref == 'refs/heads/alx/native-preview'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if gh release upload "$SERVER_PREVIEW_TAG" \
              "aetherlink-native-server-linux-${{ matrix.arch }}" \
              "aetherlink-native-server-linux-${{ matrix.arch }}.sha256" --clobber; then
              exit 0
            fi
            if [[ "$attempt" -eq 5 ]]; then
              echo "Release upload failed after ${attempt} attempts" >&2
              exit 1
            fi
            sleep "$((attempt * 5))"
          done
